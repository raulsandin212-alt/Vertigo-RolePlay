# Toggle targeting when pressing the hotkey, instead of holding it down.
setr ox_target:toggleHotkey 0
# Change the key to enable targeting (https://docs.fivem.net/docs/game-references/input-mapper-parameter-ids/keyboard)
setr ox_target:defaultHotkey LMENU
# Target Mouse click button  e.g  1 or 24 for left click 25 is for right click
setr ox_target:leftClick 1
# Draw a sprite (circle) at the centroid of a zone.
setr ox_target:drawSprite 1
# Enable built-in targeting options, e.g. toggling vehicle doors.
setr ox_target:defaults 1
# Enable debugging / testing options, entity outlines, and a raycast indicator.
setr ox_target:debug 0

# Set ox_lib colors (https://mantine.dev/theming/colors/#default-colors)
setr ox:primaryColor green # Cor da color mantine
setr ox:primaryShade 6 # Númeração da color mantine
setr ox:menuBackground true # true forces background on every context menu from ox_lib
setr ox:userLocales 1 # Allow users to select their locales using /ox_lib

# Activate specific event handlers and functions (supported: ox, esx, qb, nd)
setr inventory:framework "qbx"
# Load specific language file from data/locales
setr ox:locale "pt-br"
# Number of slots for player inventories
setr inventory:slots 50
# Maximum carry capacity for players, in grams (will be automatically converted to kilograms in-game)
setr inventory:weight 85000
# Number of slots in drops
setr inventory:dropslots 50
# Maximum weight of drops, in grams
setr inventory:dropweight 85000
# Dumpsters become networked entities (not recommended)
setr inventory:networkdumpsters false
# Weapons will reload after reaching 0 ammo
setr inventory:autoreload false
# Blur the screen while accessing the inventory
setr inventory:screenblur true
# Integrated support for ox_target stashes, shops, etc
setr inventory:target false
# Default hotkeys to access primary and secondary inventories, and hotbar
setr inventory:keys ["OEM_3", "PAGEUP", "TAB"]
# Enable control action when inventory is open
setr inventory:enablekeys [249]
# Weapons must be aimed before shooting
setr inventory:aimedfiring false
# Show a list of all nearby players when giving items
setr inventory:giveplayerlist true
# Enable weapon animations when holstering
setr inventory:weaponanims true
# Notify when items are added or removed
setr inventory:itemnotify true
# Notify when weapons are equipped or holstered
setr inventory:weaponnotify true
# Where item images are loaded from
setr inventory:imagepath "nui://ox_inventory/web/images"
# Disarm players holding a weapon that was not equipped through its item
setr inventory:weaponmismatch true
# Weapons the mismatch check ignores
setr inventory:ignoreweapons []
# Suppress weapon and ammo pickups from the world
setr inventory:suppresspickups true
# Disable weapons for every player
setr inventory:disableweapons false
# Register the /steal command
setr inventory:enablestealcommand true
# Hide the "inventory is ready" notification
setr inventory:disablesetupnotification false
# Marker styles (https://docs.fivem.net/docs/game-references/markers)
setr inventory:dropmarker {"type": 2, "colour": [150, 30, 30], "scale": [0.3, 0.2, 0.15]}
setr inventory:shopmarker {"type": 29, "colour": [30, 150, 30], "scale": [0.5, 0.5, 0.5]}
setr inventory:evidencemarker {"type": 2, "colour": [30, 30, 150], "scale": [0.3, 0.2, 0.15]}
setr inventory:craftingmarker {"type": 2, "colour": [150, 150, 30], "scale": [0.3, 0.2, 0.15]}
# Jobs with access to police armoury, evidence lockers, etc
setr inventory:police ["police", "bcso", "sasp"]
# 1 For normal logging. 2 additionally log which resource called the function
set inventory:loglevel 2
# Item prices fluctuate in shops
set inventory:randomprices true
# Loot will randomly generate inside unowned vehicles and dumpsters
set inventory:randomloot true
# Minimum job grade to remove items from evidence lockers
set inventory:evidencegrade 2
# Trim whitespace from vehicle plates when checking owned vehicles
set inventory:trimplate true
# Compare current version to latest release on GitHub
set inventory:versioncheck false
# Disable drop markers and spawn a prop instead
setr inventory:dropprops true
# Set the default model used for drop props
setr inventory:dropmodel "prop_med_bag_01b"
# Possible items that can be found in a trunk
set inventory:vehicleloot [
    ["cola", 1, 1],
    ["water", 1, 1],
    ["garbage", 1, 2, 50],
    ["panties", 1, 1, 5],
    ["money", 1, 50],
    ["black_money", 200, 400, 5],
    ["bandage", 1, 1]
]
# Possible items that can be found in a dumpster
set inventory:dumpsterloot [
    ["aluminum", 1, 5],
    ["metalscrap", 1, 5],
    ["iron", 1, 5],
    ["steel", 1, 5],
    ["glass", 1, 5],
    ["rubber", 1, 5],
    ["plastic", 1, 5]
]
# Stashes will be wiped after remaining unchanged for the given time
set inventory:clearstashes "6 MONTH"
# Save stashes in batches instead of one query each
set inventory:bulkstashsave true
# Minutes before temporary inventories are cleared
set inventory:cleartime 5
# Log hook rejections to the console
set inventory:loghookrejection true
# Items synced with framework accounts
set inventory:accounts ["money"]
# Discord webhook to review custom item images (metadata.imageurl)
set inventory:webhook ""
# Hosts allowed for custom item images when the webhook is set
set inventory:validhosts {"r2.fivemanage.com": true, "i.fmfile.com": true}
# Set datadog API key for inventory logging (https://app.datadoghq.com/organization-settings/api-keys)
set datadog:key ""
# Set server intake (https://docs.datadoghq.com/api/latest/logs/#send-logs)
set datadog:site "datadoghq.com"
# Set server hostname
set datadog:hostname "FXServer"
# Set Logger
#set ox:logger "fivemerr"